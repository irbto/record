[workspace]
members = ["crates/record-core"]
resolver = "3"

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/irbto/record"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[package]
name = "record-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "One-command Windows system-audio MP3 recording and DXGI screen capture to H.264/AAC MP4"
repository.workspace = true
homepage = "https://github.com/irbto/record"
license.workspace = true
keywords = ["audio", "recording", "terminal", "wasapi", "mp3", "screen-capture", "mp4", "h264"]
categories = ["command-line-utilities", "multimedia::audio"]
readme = "README.md"

[[bin]]
name = "record"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
ctrlc = "3.5.2"
image = { version = "0.25.6", default-features = false, features = ["png"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
record-core = { path = "crates/record-core" }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints]
workspace = true

name: Bug report
description: Report a reproducible capture, encoding, or terminal problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach a recording that contains private audio.
  - type: input
    id: version
    attributes:
      label: record version
      placeholder: Paste the output from record --version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: System check output
      description: Paste the output from record doctor
      render: text

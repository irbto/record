name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check project text punctuation
        shell: pwsh
        run: |
          $textFiles = @(git ls-files "*.md" "*.yml" "*.yaml" "*.rs" "*.ps1" "*.toml")
          $emDash = [string][char]0x2014
          $enDash = [string][char]0x2013
          $matches = @(
            Select-String -LiteralPath $textFiles -SimpleMatch $emDash
            Select-String -LiteralPath $textFiles -SimpleMatch $enDash
          )
          if ($matches.Count) {
            $matches | ForEach-Object { Write-Error $_.ToString() }
            throw "Project text must not contain en dashes or em dashes."
          }
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          [Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          [Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/benchmark-startup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Release build
        run: cargo build --release

  msrv:
    name: Rust 1.90
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Check minimum supported Rust
        run: cargo +1.90.0 check --all-targets

  release-tag:
    name: Tag release
    needs: [windows, msrv]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create version tag when missing
        shell: bash
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the package version from Cargo.toml"
            exit 1
          fi
          TAG="v$VERSION"
          echo "package version $VERSION -> $TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists on the remote; skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "record $TAG"
          git push origin "$TAG"
          echo "::notice::pushed $TAG; the Release workflow will publish the exe"

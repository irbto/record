name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check project text punctuation
        shell: pwsh
        run: |
          $textFiles = @(git ls-files "*.md" "*.yml" "*.yaml" "*.rs" "*.ps1" "*.toml")
          $emDash = [string][char]0x2014
          $matches = @(Select-String -LiteralPath $textFiles -SimpleMatch $emDash)
          if ($matches.Count) {
            $matches | ForEach-Object { Write-Error $_.ToString() }
            throw "Documentation must not contain em dashes."
          }
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          [Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          [Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/benchmark-startup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Release build
        run: cargo build --locked --release

  msrv:
    name: Rust 1.88
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MSRV
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check minimum supported Rust
        run: cargo +1.88.0 check --locked --all-targets

  portable-core:
    name: Portable core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check non-Windows fallback
        run: cargo check --locked --all-targets

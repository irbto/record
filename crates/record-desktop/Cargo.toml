[package]
name = "record-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Desktop dashboard for record: sound, video, and screenshots in one window"
repository.workspace = true
license.workspace = true

[[bin]]
name = "record-desktop"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5.16"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.37.0"
image = { version = "0.25.6", default-features = false, features = ["png"] }
record-core = { path = "../record-core" }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true

[package]
name = "record-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Desktop program for record: audio, video, and screenshots in one window"
repository.workspace = true
license.workspace = true

[lib]
name = "record_desktop"
path = "src/lib.rs"

[[bin]]
name = "record-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crossbeam-channel = "0.5.16"
record-core = { path = "../record-core" }
serde = { version = "1", features = ["derive"] }
# `custom-protocol` selects the production mode: the window always shows the
# interface that is embedded in the executable. The Tauri command line tool
# sets this feature itself, and this project builds with plain Cargo.
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-single-instance = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3.23.0"

[lints]
workspace = true
